name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11bd71901bb5b17202b0132d3d4595fb7b7e69b5  # v4.2.2, pinned for supply-chain security

    - name: Install dependencies
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install ninja

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: |
        cmake --build build --config Debug

    - name: Test
      run: |
        ctest --test-dir build --config Debug --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bb5b17202b0132d3d4595fb7b7e69b5  # v4.2.2, pinned for supply-chain security

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        echo "Checking C++ formatting..."
        FILES=$(find . -name '*.cpp' -o -name '*.h' 2>/dev/null || true)
        if [ -n "$FILES" ]; then
          echo "$FILES" | xargs clang-format --dry-run --Werror
        else
          echo "No C++ files found, skipping format check"
        fi
